# API Gateway + servidor do frontend (painel central e app do gerente).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirecionamentos relativos: o nginx escuta na porta 80 do container, mas o acesso
    # externo vem por outra porta (ex.: :8088). Sem isso, /gerente -> /gerente/ perdia a porta.
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $os_service http://os-service:3001;
    set $notification_service http://notification-service:3002;

    # Tempo real (Server-Sent Events): sem buffer e conexão longa.
    location = /api/eventos/stream {
        proxy_pass $os_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location ~ ^/api/(notificacoes|whatsapp) {
        proxy_pass $notification_service;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass $os_service;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100k;
    }

    location = /gerente { return 301 /gerente/; }

    location ~* \.webmanifest$ {
        types { application/manifest+json webmanifest; }
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
