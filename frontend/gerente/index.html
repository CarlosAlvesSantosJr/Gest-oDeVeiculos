<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a3f9a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Gerente da Oficina</title>
  <link rel="manifest" href="/gerente/manifest.webmanifest">
  <link rel="icon" href="/assets/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icone.svg">
  <link rel="stylesheet" href="/assets/base.css">
  <style>
    body { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
    .topo {
      position: sticky; top: 0; z-index: 5; background: var(--bg-2); border-bottom: 1px solid var(--card-borda);
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    }
    .topo-linha { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .topo h1 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .topo h1 img { width: 28px; height: 28px; }
    .sair { background: none; border: 0; color: var(--texto-2); font-size: 13px; padding: 6px; }
    .busca {
      width: 100%; margin-top: 10px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--card-borda);
      background: var(--card); color: var(--texto); font-size: 16px;
    }
    .filtros { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px; scrollbar-width: none; }
    .chip {
      flex: none; border: 1px solid var(--card-borda); background: var(--card); color: var(--texto);
      border-radius: 999px; padding: 7px 12px; font-size: 13px; display: flex; gap: 6px; align-items: center;
    }
    .chip b { font-variant-numeric: tabular-nums; }
    .chip[aria-pressed="true"] { background: var(--cor, #e8edf2); color: #111; border-color: transparent; }

    .lista { padding: 12px 16px; display: grid; gap: 10px; }
    .item {
      width: 100%; text-align: left; color: inherit; background: var(--card); border: 1px solid var(--card-borda);
      border-left: 5px solid var(--cor); border-radius: 12px; padding: 12px; display: grid; gap: 8px;
    }
    .item-topo { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .item .veiculo { font-weight: 700; font-size: 16px; }
    .item .cliente { color: var(--texto-2); font-size: 13px; }
    .selo {
      display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
      color: var(--cor); background: color-mix(in srgb, var(--cor) 15%, transparent);
      padding: 4px 8px; border-radius: 999px; justify-self: start;
    }
    .item .placa { min-width: 100px; }
    .item .placa-num { font-size: 18px; }
    .vazio { text-align: center; color: var(--texto-2); padding: 40px 16px; }

    .fab {
      position: fixed; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 6;
      background: var(--pronto); color: #0b2416; border: 0; border-radius: 999px; padding: 15px 20px;
      font-weight: 700; font-size: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.45);
    }

    /* Folha inferior (bottom sheet) */
    .fundo { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 10; display: none; }
    .folha {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--bg-2);
      border-radius: 18px 18px 0 0; border-top: 1px solid var(--card-borda);
      padding: 10px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto;
      transform: translateY(105%); transition: transform .22s ease;
    }
    .aberta .fundo { display: block; }
    .aberta .folha { transform: none; }
    .alca { width: 44px; height: 5px; border-radius: 3px; background: var(--card-borda); margin: 0 auto 12px; }
    .folha h2 { margin: 0 0 4px; font-size: 18px; }
    .folha .sub { color: var(--texto-2); font-size: 13px; margin: 0 0 14px; }
    .botoes-status { display: grid; gap: 10px; }
    .btn-status {
      display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600;
      border: 2px solid var(--cor); background: color-mix(in srgb, var(--cor) 12%, transparent); color: var(--texto);
    }
    .btn-status[aria-current="true"] { background: var(--cor); color: #111; }
    .btn-status[aria-current="true"]::after { content: 'atual'; margin-left: auto; font-size: 12px; font-weight: 500; }
    .btn-status:disabled { opacity: .55; }
    .btn-entregar { width: 100%; margin-top: 14px; padding: 15px; border-radius: 12px; border: 1px dashed var(--texto-2); background: none; color: var(--texto); font-weight: 600; }
    .aviso-wpp { font-size: 12px; color: var(--pronto); margin: 4px 0 0; }

    label { display: grid; gap: 6px; font-size: 13px; color: var(--texto-2); margin-bottom: 12px; min-width: 0; }
    input, textarea, select {
      width: 100%; min-width: 0;
      font: inherit; font-size: 16px; color: var(--texto); background: var(--card);
      border: 1px solid var(--card-borda); border-radius: 10px; padding: 12px;
    }
    input:focus, textarea:focus, select:focus, .busca:focus { outline: 2px solid var(--andamento); outline-offset: 1px; }
    .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .primario {
      width: 100%; padding: 15px; border: 0; border-radius: 12px; background: var(--andamento); color: #fff;
      font-weight: 700; font-size: 16px;
    }
    .primario:disabled { opacity: .6; }

    #login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    #login form {
      width: 100%; max-width: 360px; background: var(--bg-2); border: 1px solid var(--card-borda);
      border-radius: 18px; padding: 24px;
    }
    #login img { width: 56px; display: block; margin: 0 auto 10px; }
    #login h1 { text-align: center; margin: 0 0 4px; font-size: 20px; }
    #login p { text-align: center; color: var(--texto-2); margin: 0 0 20px; font-size: 14px; }
    .erro { color: var(--perigo); font-size: 13px; min-height: 18px; margin: 0 0 8px; }

    .toast {
      position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
      background: #e8edf2; color: #111; padding: 12px 16px; border-radius: 10px; font-size: 14px; font-weight: 500;
      opacity: 0; transition: .2s; z-index: 20; max-width: calc(100% - 32px); pointer-events: none;
    }
    .toast.ver { opacity: 1; transform: translate(-50%, 0); }
    .toast.ruim { background: var(--perigo); color: #fff; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <section id="login" hidden>
    <form id="form-login">
      <img src="/assets/icone.svg" alt="">
      <h1>Acesso do gerente</h1>
      <p>Informe o código de acesso da oficina</p>
      <label>Código de acesso
        <input id="token" type="password" autocomplete="current-password" required>
      </label>
      <p class="erro" id="erro-login" role="alert"></p>
      <button class="primario" type="submit">Entrar</button>
    </form>
  </section>

  <div id="app" hidden>
    <header class="topo">
      <div class="topo-linha">
        <h1><img src="/assets/icone.svg" alt="">Gerente</h1>
        <span id="conexao" class="conexao">Conectando…</span>
        <button class="sair" id="sair" type="button">Sair</button>
      </div>
      <input class="busca" id="busca" type="search" placeholder="Buscar placa, modelo ou cliente" aria-label="Buscar">
      <div class="filtros" id="filtros" role="group" aria-label="Filtrar por status"></div>
    </header>
    <main class="lista" id="lista" aria-live="polite"></main>
    <button class="fab" id="novo" type="button">＋ Novo veículo</button>
  </div>

  <div id="camada-folha">
    <div class="fundo" data-fechar></div>
    <div class="folha" role="dialog" aria-modal="true" aria-labelledby="folha-titulo">
      <div class="alca"></div>
      <div id="folha-conteudo"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script type="module">
    import { STATUS, assinarEventos, esc, formatarPlaca, placaHTML, rotuloStatus, tempoDesde } from '/assets/comum.js';

    const $ = (id) => document.getElementById(id);
    const CHAVE = 'oficina.tokenGerente';
    const ordens = new Map();
    let filtro = '';
    let token = '';
    try { token = localStorage.getItem(CHAVE) || ''; } catch { /* armazenamento indisponível */ }

    async function api(caminho, opcoes = {}) {
      const resp = await fetch(caminho, {
        ...opcoes,
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}`, ...opcoes.headers },
      });
      if (resp.status === 401) { sair(); throw new Error('Sessão expirada, entre novamente'); }
      const corpo = resp.status === 204 ? null : await resp.json().catch(() => null);
      if (!resp.ok) throw new Error([corpo?.erro, ...(corpo?.detalhes ?? [])].filter(Boolean).join(': ') || `Erro ${resp.status}`);
      return corpo;
    }

    function toast(texto, ruim = false) {
      const t = $('toast');
      t.textContent = texto;
      t.classList.toggle('ruim', ruim);
      t.classList.add('ver');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => t.classList.remove('ver'), 3200);
    }

    // ---------- Login ----------
    async function entrar(candidato) {
      const resp = await fetch('/api/auth/verificar', { method: 'POST', headers: { Authorization: `Bearer ${candidato}` } });
      return resp.status === 204;
    }

    $('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const candidato = $('token').value.trim();
      $('erro-login').textContent = '';
      if (await entrar(candidato)) {
        token = candidato;
        try { localStorage.setItem(CHAVE, token); } catch { /* segue sem lembrar */ }
        iniciarApp();
      } else {
        $('erro-login').textContent = 'Código de acesso inválido';
      }
    });

    function sair() {
      token = '';
      try { localStorage.removeItem(CHAVE); } catch { /* nada */ }
      $('app').hidden = true;
      $('login').hidden = false;
      fecharFolha();
    }
    $('sair').addEventListener('click', sair);

    // ---------- Lista ----------
    function renderizarFiltros() {
      const contagem = Object.fromEntries(STATUS.map((s) => [s.codigo, 0]));
      for (const o of ordens.values()) contagem[o.status] = (contagem[o.status] ?? 0) + 1;
      $('filtros').innerHTML = `<button class="chip" type="button" data-filtro="" aria-pressed="${!filtro}">Todos <b>${ordens.size}</b></button>`
        + STATUS.map((s) => `<button class="chip" type="button" data-filtro="${s.codigo}" data-status="${s.codigo}"
          aria-pressed="${filtro === s.codigo}">${s.icone} ${s.curto} <b>${contagem[s.codigo]}</b></button>`).join('');
    }

    function renderizarLista() {
      const termo = $('busca').value.trim().toUpperCase().replace(/-/g, '');
      const ordemStatus = STATUS.map((s) => s.codigo);
      const visiveis = [...ordens.values()]
        .filter((o) => !filtro || o.status === filtro)
        .filter((o) => !termo || `${o.placa} ${o.marca} ${o.modelo} ${o.clienteNome}`.toUpperCase().includes(termo))
        .sort((a, b) => ordemStatus.indexOf(a.status) - ordemStatus.indexOf(b.status) || a.atualizadoEm.localeCompare(b.atualizadoEm));

      $('lista').innerHTML = visiveis.map((o) => `
        <button class="item" type="button" data-id="${o.id}" data-status="${o.status}">
          <div class="item-topo">
            <div><div class="veiculo">${esc(o.marca)} ${esc(o.modelo)}</div><div class="cliente">${esc(o.clienteNome)}</div></div>
            ${placaHTML(o.placa)}
          </div>
          <span class="selo">${esc(rotuloStatus(o.status))} · ${tempoDesde(o.atualizadoEm)}</span>
        </button>`).join('') || '<div class="vazio">Nenhum veículo encontrado</div>';
    }

    function renderizar() { renderizarFiltros(); renderizarLista(); }

    $('filtros').addEventListener('click', (e) => {
      const chip = e.target.closest('[data-filtro]');
      if (!chip) return;
      filtro = chip.dataset.filtro;
      renderizar();
    });
    $('busca').addEventListener('input', renderizarLista);
    $('lista').addEventListener('click', (e) => {
      const item = e.target.closest('[data-id]');
      if (item) abrirStatus(item.dataset.id);
    });

    async function carregar() {
      const lista = await api('/api/ordens');
      ordens.clear();
      for (const o of lista) ordens.set(o.id, o);
      renderizar();
    }

    // ---------- Folha inferior ----------
    function abrirFolha(html) {
      $('folha-conteudo').innerHTML = html;
      document.body.classList.add('aberta');
    }
    function fecharFolha() { document.body.classList.remove('aberta'); }
    document.querySelector('[data-fechar]').addEventListener('click', fecharFolha);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fecharFolha(); });

    function abrirStatus(id) {
      const o = ordens.get(id);
      if (!o) return;
      abrirFolha(`
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
          <div><h2 id="folha-titulo">${esc(o.marca)} ${esc(o.modelo)}</h2>
          <p class="sub">${esc(o.clienteNome)}${o.servico ? ` · ${esc(o.servico)}` : ''}</p></div>
          ${placaHTML(o.placa)}
        </div>
        <label>Observação (opcional)<input id="obs" maxlength="300" placeholder="Ex.: peça chega amanhã"></label>
        <div class="botoes-status">
          ${STATUS.map((s) => `<button type="button" class="btn-status" data-status="${s.codigo}" data-novo="${s.codigo}"
            aria-current="${o.status === s.codigo}" ${o.status === s.codigo ? 'disabled' : ''}>
            <span aria-hidden="true">${s.icone}</span>${s.rotulo}</button>`).join('')}
        </div>
        <p class="aviso-wpp">✅ Ao marcar "Pronto para Entrega" o cliente recebe um WhatsApp automaticamente.</p>
        ${o.status === 'PRONTO_PARA_ENTREGA' ? '<button type="button" class="btn-entregar" data-novo="ENTREGUE">🚗 Veículo entregue ao cliente (sai do painel)</button>' : ''}
      `);
      $('folha-conteudo').onclick = async (e) => {
        const botao = e.target.closest('[data-novo]');
        if (!botao || botao.disabled) return;
        const novo = botao.dataset.novo;
        $('folha-conteudo').querySelectorAll('button').forEach((b) => { b.disabled = true; });
        try {
          const atualizada = await api(`/api/ordens/${id}/status`, {
            method: 'PATCH', body: JSON.stringify({ status: novo, observacao: $('obs').value }),
          });
          aplicar(atualizada);
          fecharFolha();
          toast(novo === 'PRONTO_PARA_ENTREGA'
            ? `${formatarPlaca(o.placa)} pronto! Cliente será avisado no WhatsApp 📲`
            : `${formatarPlaca(o.placa)} → ${rotuloStatus(novo)}`);
        } catch (erro) {
          toast(erro.message, true);
          abrirStatus(id);
        }
      };
    }

    $('novo').addEventListener('click', () => {
      abrirFolha(`
        <h2 id="folha-titulo">Entrada de veículo</h2>
        <p class="sub">Cadastre o veículo para aparecer no painel central</p>
        <form id="form-novo">
          <div class="duas">
            <label>Placa<input name="placa" required maxlength="8" autocapitalize="characters" placeholder="ABC1D23"></label>
            <label>Cor<input name="cor" maxlength="30" placeholder="Prata"></label>
          </div>
          <div class="duas">
            <label>Marca<input name="marca" required maxlength="40" placeholder="Fiat"></label>
            <label>Modelo<input name="modelo" required maxlength="60" placeholder="Argo"></label>
          </div>
          <label>Nome do cliente<input name="clienteNome" required maxlength="80" autocomplete="off"></label>
          <label>WhatsApp do cliente<input name="clienteTelefone" required type="tel" inputmode="tel" placeholder="(11) 98765-4321"></label>
          <label>Serviço<textarea name="servico" rows="2" maxlength="500" placeholder="Descreva o problema ou serviço"></textarea></label>
          <label>Status inicial
            <select name="status">${STATUS.map((s) => `<option value="${s.codigo}">${s.rotulo}</option>`).join('')}</select>
          </label>
          <button class="primario" type="submit">Cadastrar</button>
        </form>`);
      $('form-novo').addEventListener('submit', async (e) => {
        e.preventDefault();
        const botao = e.target.querySelector('button[type=submit]');
        botao.disabled = true;
        try {
          const criada = await api('/api/ordens', { method: 'POST', body: JSON.stringify(Object.fromEntries(new FormData(e.target))) });
          aplicar(criada);
          fecharFolha();
          toast(`${formatarPlaca(criada.placa)} cadastrado no painel`);
        } catch (erro) {
          toast(erro.message, true);
          botao.disabled = false;
        }
      });
    });

    function aplicar(ordem) {
      if (ordem.status === 'ENTREGUE') ordens.delete(ordem.id);
      else ordens.set(ordem.id, ordem);
      renderizar();
    }

    // ---------- Inicialização ----------
    let pararEventos = null;
    async function iniciarApp() {
      $('login').hidden = true;
      $('app').hidden = false;
      try { await carregar(); } catch (erro) { toast(erro.message, true); }
      pararEventos?.();
      pararEventos = assinarEventos({
        aoConectar() { $('conexao').textContent = 'Ao vivo'; $('conexao').classList.add('on'); carregar().catch(() => {}); },
        aoDesconectar() { $('conexao').textContent = 'Offline'; $('conexao').classList.remove('on'); },
        aoMudar(tipo, dados) { aplicar(tipo === 'criada' ? dados : dados.ordem); },
      });
    }
    setInterval(() => { if (!$('app').hidden) renderizarLista(); }, 60 * 1000);

    if (token && await entrar(token)) iniciarApp();
    else $('login').hidden = false;
  </script>
</body>
</html>
