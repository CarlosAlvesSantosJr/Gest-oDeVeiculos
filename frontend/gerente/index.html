<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Auto Marcas · Gerente</title>
  <link rel="manifest" href="/gerente/manifest.webmanifest">
  <link rel="icon" href="/assets/logo-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/logo-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@1,700;1,900&display=swap">
  <link rel="stylesheet" href="/assets/base.css">
  <style>
    body { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
    .topo { position: sticky; top: 0; z-index: 5; background: #000; }
    .topo-conteudo { padding: calc(10px + env(safe-area-inset-top)) 16px 12px; }
    .topo-linha { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .topo .marca-oficina { gap: 10px; }
    .topo .marca-oficina img { width: 38px; height: 38px; }
    .topo .marca-texto small { font-size: 10px; }
    .topo .marca-texto b { font-size: 19px; }
    .topo-acoes { display: flex; align-items: center; gap: 4px; }
    @media (max-width: 420px) { .topo-acoes .conexao { font-size: 0; gap: 0; padding: 0 4px; } }
    .sair { background: none; border: 0; color: var(--texto-2); font-size: 13px; padding: 6px; }
    .btn-wpp {
      display: inline-flex; align-items: center; gap: 6px; background: var(--card); color: var(--texto);
      border: 1px solid var(--card-borda); border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 600;
    }
    .wpp-ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--texto-2); }
    .wpp-ponto.ok { background: var(--pronto); }
    .wpp-ponto.alerta { background: var(--orcamento); }
    .wpp-ponto.erro { background: var(--perigo); }
    .wpp-estado { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--card-borda); margin-bottom: 14px; }
    .wpp-estado strong { display: block; }
    .wpp-estado small { color: var(--texto-2); }
    .codigo-pareamento {
      font: 800 34px/1.1 'Roboto Mono', ui-monospace, Consolas, monospace; letter-spacing: .12em; text-align: center;
      background: #fff; color: #111; border-radius: 12px; padding: 14px; margin: 6px 0 14px;
    }
    .qr-wpp { display: block; width: 240px; height: 240px; margin: 0 auto 14px; border-radius: 12px; background: #fff; padding: 8px; }
    .passos { margin: 0 0 14px; padding-left: 20px; color: var(--texto-2); font-size: 14px; display: grid; gap: 6px; }
    .passos b { color: var(--texto); }
    .secundario { width: 100%; padding: 13px; border-radius: 12px; border: 1px solid var(--card-borda); background: none; color: var(--texto); font-weight: 600; }
    .busca {
      width: 100%; margin-top: 10px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--card-borda);
      background: var(--card); color: var(--texto); font-size: 16px;
    }
    .filtros { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px; scrollbar-width: none; }
    .chip {
      flex: none; border: 1px solid var(--card-borda); background: var(--card); color: var(--texto);
      border-radius: 999px; padding: 7px 12px; font-size: 13px; display: flex; gap: 6px; align-items: center;
    }
    .chip b { font-variant-numeric: tabular-nums; }
    .chip[aria-pressed="true"] { background: var(--cor, var(--marca)); color: var(--cor-texto, #fff); border-color: transparent; }
    .chip[data-status][aria-pressed="true"] { --cor-texto: #111; }

    .lista { padding: 12px 16px; display: grid; gap: 10px; }
    .item {
      width: 100%; text-align: left; color: inherit; background: var(--card); border: 1px solid var(--card-borda);
      border-left: 5px solid var(--cor); border-radius: 12px; padding: 12px; display: grid; gap: 8px;
    }
    .item-topo { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .item .veiculo { font-weight: 700; font-size: 16px; }
    .item .cliente { color: var(--texto-2); font-size: 13px; }
    .selo {
      display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
      color: var(--cor); background: color-mix(in srgb, var(--cor) 15%, transparent);
      padding: 4px 8px; border-radius: 999px; justify-self: start;
    }
    .item .placa { min-width: 100px; }
    .item .placa-num { font-size: 18px; }
    .vazio { text-align: center; color: var(--texto-2); padding: 40px 16px; }

    .fab {
      position: fixed; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 6;
      background: var(--marca); color: #fff; border: 0; border-radius: 999px; padding: 15px 20px;
      font-weight: 700; font-size: 16px; box-shadow: 0 8px 24px rgba(227,20,27,.35);
    }

    /* Folha inferior (bottom sheet) */
    .fundo { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 10; display: none; }
    .folha {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--bg-2);
      border-radius: 18px 18px 0 0; border-top: 3px solid var(--marca);
      padding: 10px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto;
      transform: translateY(105%); transition: transform .22s ease;
    }
    .aberta .fundo { display: block; }
    .aberta .folha { transform: none; }
    .alca { width: 44px; height: 5px; border-radius: 3px; background: var(--card-borda); margin: 0 auto 12px; }
    .folha h2 { margin: 0 0 4px; font-size: 18px; }
    .folha .sub { color: var(--texto-2); font-size: 13px; margin: 0 0 14px; }
    .folha-cabecalho { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
    .folha-cabecalho .sub { margin: 0; }

    .abas {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; margin-bottom: 14px;
      background: var(--card); border: 1px solid var(--card-borda); border-radius: 12px;
    }
    .aba {
      border: 0; background: none; color: var(--texto-2); padding: 10px 6px; border-radius: 9px;
      font-size: 14px; font-weight: 600;
    }
    .aba[aria-selected="true"] { background: var(--marca); color: #fff; }

    .botoes-status { display: grid; gap: 10px; }
    .btn-status {
      display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600;
      border: 2px solid var(--cor); background: color-mix(in srgb, var(--cor) 12%, transparent); color: var(--texto);
    }
    .btn-status[aria-current="true"] { background: var(--cor); color: #111; }
    .btn-status[aria-current="true"]::after { content: 'atual'; margin-left: auto; font-size: 12px; font-weight: 500; }
    .btn-status:disabled { opacity: .55; }
    .btn-entregar { width: 100%; margin-top: 14px; padding: 15px; border-radius: 12px; border: 1px dashed var(--texto-2); background: none; color: var(--texto); font-weight: 600; }
    .aviso-wpp { font-size: 12px; color: var(--pronto); margin: 8px 0 0; }

    .linha-tempo { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--card-borda); display: grid; gap: 14px; }
    .linha-tempo li { position: relative; font-size: 14px; }
    .linha-tempo li::before {
      content: ''; position: absolute; left: -21px; top: 4px; width: 12px; height: 12px; border-radius: 50%;
      background: var(--cor, var(--texto-2)); border: 2px solid var(--bg-2);
    }
    .linha-tempo time { display: block; color: var(--texto-2); font-size: 12px; margin-bottom: 2px; }
    .linha-tempo .obs { color: var(--texto-2); font-size: 13px; margin-top: 2px; }

    label { display: grid; gap: 6px; font-size: 13px; color: var(--texto-2); margin-bottom: 12px; min-width: 0; }
    input, textarea, select {
      width: 100%; min-width: 0;
      font: inherit; font-size: 16px; color: var(--texto); background: var(--card);
      border: 1px solid var(--card-borda); border-radius: 10px; padding: 12px;
    }
    input:focus, textarea:focus, select:focus, .busca:focus { outline: 2px solid var(--marca); outline-offset: 1px; }
    .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .primario {
      width: 100%; padding: 15px; border: 0; border-radius: 12px; background: var(--marca); color: #fff;
      font-weight: 700; font-size: 16px;
    }
    .primario:active { background: var(--marca-forte); }
    .primario:disabled { opacity: .6; }
    .dica { font-size: 12px; color: var(--texto-2); margin: -4px 0 14px; }

    #login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(circle at 50% 30%, #1d0405, var(--bg) 60%); }
    #login form {
      width: 100%; max-width: 360px; background: var(--bg-2); border: 1px solid var(--card-borda);
      border-top: 3px solid var(--marca); border-radius: 18px; padding: 24px;
    }
    #login img { width: 132px; height: 132px; display: block; margin: 0 auto 12px; border-radius: 50%; }
    #login h1 { text-align: center; margin: 0 0 4px; font-size: 20px; }
    #login p { text-align: center; color: var(--texto-2); margin: 0 0 20px; font-size: 14px; }
    .erro { color: var(--perigo); font-size: 13px; min-height: 18px; margin: 0 0 8px; }

    .toast {
      position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
      background: #f4f4f5; color: #111; padding: 12px 16px; border-radius: 10px; font-size: 14px; font-weight: 500;
      opacity: 0; transition: .2s; z-index: 20; max-width: calc(100% - 32px); pointer-events: none;
    }
    .toast.ver { opacity: 1; transform: translate(-50%, 0); }
    .toast.ruim { background: var(--perigo); color: #fff; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <section id="login" hidden>
    <form id="form-login">
      <img src="/assets/logo-512.png" alt="Mecânica Auto Marcas">
      <h1>Acesso do gerente</h1>
      <p>Informe o código de acesso da oficina</p>
      <label>Código de acesso
        <input id="token" type="password" autocomplete="current-password" required>
      </label>
      <p class="erro" id="erro-login" role="alert"></p>
      <button class="primario" type="submit">Entrar</button>
    </form>
  </section>

  <div id="app" hidden>
    <header class="topo">
      <div class="topo-conteudo">
        <div class="topo-linha">
          <span id="marca"></span>
          <div class="topo-acoes">
            <button class="btn-wpp" id="btn-wpp" type="button" title="Conexão do WhatsApp"><span class="wpp-ponto" id="wpp-ponto"></span>WhatsApp</button>
            <span id="conexao" class="conexao" title="Atualização em tempo real">Conectando…</span>
            <button class="sair" id="sair" type="button">Sair</button>
          </div>
        </div>
        <input class="busca" id="busca" type="search" placeholder="Buscar placa, modelo ou cliente" aria-label="Buscar">
        <div class="filtros" id="filtros" role="group" aria-label="Filtrar por status"></div>
      </div>
      <div class="faixa-marca" aria-hidden="true"></div>
    </header>
    <main class="lista" id="lista" aria-live="polite"></main>
    <button class="fab" id="novo" type="button">＋ Novo veículo</button>
  </div>

  <div id="camada-folha">
    <div class="fundo" data-fechar></div>
    <div class="folha" role="dialog" aria-modal="true" aria-labelledby="folha-titulo">
      <div class="alca"></div>
      <div id="folha-conteudo"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script type="module">
    import {
      STATUS, assinarEventos, esc, formatarDataHora, formatarNomeProprio, formatarPlaca, formatarTelefone,
      marcaHTML, placaHTML, rotuloStatus, tempoDesde,
    } from '/assets/comum.js';

    const $ = (id) => document.getElementById(id);
    const CHAVE = 'oficina.tokenGerente';
    const ordens = new Map();
    let filtro = '';
    let token = '';
    try { token = localStorage.getItem(CHAVE) || ''; } catch { /* armazenamento indisponível */ }
    $('marca').innerHTML = marcaHTML();

    async function api(caminho, opcoes = {}) {
      const resp = await fetch(caminho, {
        ...opcoes,
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}`, ...opcoes.headers },
      });
      if (resp.status === 401) { sair(); throw new Error('Sessão expirada, entre novamente'); }
      const corpo = resp.status === 204 ? null : await resp.json().catch(() => null);
      if (!resp.ok) throw new Error([corpo?.erro, ...(corpo?.detalhes ?? [])].filter(Boolean).join(': ') || `Erro ${resp.status}`);
      return corpo;
    }

    function toast(texto, ruim = false) {
      const t = $('toast');
      t.textContent = texto;
      t.classList.toggle('ruim', ruim);
      t.classList.add('ver');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => t.classList.remove('ver'), 3200);
    }

    // ---------- Login ----------
    async function entrar(candidato) {
      const resp = await fetch('/api/auth/verificar', { method: 'POST', headers: { Authorization: `Bearer ${candidato}` } });
      return resp.status === 204;
    }

    $('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const candidato = $('token').value.trim();
      $('erro-login').textContent = '';
      if (await entrar(candidato)) {
        token = candidato;
        try { localStorage.setItem(CHAVE, token); } catch { /* segue sem lembrar */ }
        iniciarApp();
      } else {
        $('erro-login').textContent = 'Código de acesso inválido';
      }
    });

    function sair() {
      token = '';
      try { localStorage.removeItem(CHAVE); } catch { /* nada */ }
      $('app').hidden = true;
      $('login').hidden = false;
      fecharFolha();
    }
    $('sair').addEventListener('click', sair);

    // ---------- Lista ----------
    function renderizarFiltros() {
      const contagem = Object.fromEntries(STATUS.map((s) => [s.codigo, 0]));
      for (const o of ordens.values()) contagem[o.status] = (contagem[o.status] ?? 0) + 1;
      $('filtros').innerHTML = `<button class="chip" type="button" data-filtro="" aria-pressed="${!filtro}">Todos <b>${ordens.size}</b></button>`
        + STATUS.map((s) => `<button class="chip" type="button" data-filtro="${s.codigo}" data-status="${s.codigo}"
          aria-pressed="${filtro === s.codigo}">${s.icone} ${s.curto} <b>${contagem[s.codigo]}</b></button>`).join('');
    }

    function renderizarLista() {
      const termo = $('busca').value.trim().toUpperCase().replace(/-/g, '');
      const ordemStatus = STATUS.map((s) => s.codigo);
      const visiveis = [...ordens.values()]
        .filter((o) => !filtro || o.status === filtro)
        .filter((o) => !termo || `${o.placa} ${o.marca} ${o.modelo} ${o.clienteNome}`.toUpperCase().includes(termo))
        .sort((a, b) => ordemStatus.indexOf(a.status) - ordemStatus.indexOf(b.status) || a.atualizadoEm.localeCompare(b.atualizadoEm));

      $('lista').innerHTML = visiveis.map((o) => `
        <button class="item" type="button" data-id="${o.id}" data-status="${o.status}">
          <div class="item-topo">
            <div><div class="veiculo">${esc(o.marca)} ${esc(o.modelo)}</div><div class="cliente">${esc(o.clienteNome)}</div></div>
            ${placaHTML(o.placa)}
          </div>
          <span class="selo">${esc(rotuloStatus(o.status))} · ${tempoDesde(o.atualizadoEm)}</span>
        </button>`).join('') || '<div class="vazio">Nenhum veículo encontrado</div>';
    }

    function renderizar() { renderizarFiltros(); renderizarLista(); }

    $('filtros').addEventListener('click', (e) => {
      const chip = e.target.closest('[data-filtro]');
      if (!chip) return;
      filtro = chip.dataset.filtro;
      renderizar();
    });
    $('busca').addEventListener('input', renderizarLista);
    $('lista').addEventListener('click', (e) => {
      const item = e.target.closest('[data-id]');
      if (item) abrirVeiculo(item.dataset.id);
    });

    async function carregar() {
      const lista = await api('/api/ordens');
      ordens.clear();
      for (const o of lista) ordens.set(o.id, o);
      renderizar();
    }

    // ---------- Folha inferior ----------
    function abrirFolha(html) {
      $('folha-conteudo').innerHTML = html;
      document.body.classList.add('aberta');
    }
    function fecharFolha() { document.body.classList.remove('aberta'); }
    document.querySelector('[data-fechar]').addEventListener('click', fecharFolha);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fecharFolha(); });

    // Corrige maiúsculas dos nomes próprios ao sair do campo (o servidor aplica a mesma regra).
    function ativarFormatacaoNomes(form) {
      form.addEventListener('focusout', (e) => {
        const tipo = e.target.dataset?.nome;
        if (tipo) e.target.value = formatarNomeProprio(e.target.value, { tipo });
        if (e.target.name === 'placa') e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      });
    }

    function camposVeiculoHTML(o = {}) {
      return `
        <div class="duas">
          <label>Placa<input name="placa" required maxlength="8" autocapitalize="characters" placeholder="ABC1D23" value="${esc(o.placa)}"></label>
          <label>Cor<input name="cor" maxlength="30" data-nome="veiculo" placeholder="Prata" value="${esc(o.cor)}"></label>
        </div>
        <div class="duas">
          <label>Marca<input name="marca" required maxlength="40" data-nome="veiculo" placeholder="Fiat" value="${esc(o.marca)}"></label>
          <label>Modelo<input name="modelo" required maxlength="60" data-nome="veiculo" placeholder="Argo" value="${esc(o.modelo)}"></label>
        </div>
        <label>Nome do cliente<input name="clienteNome" required maxlength="80" autocomplete="off" autocapitalize="words"
          data-nome="pessoa" value="${esc(o.clienteNome)}"></label>
        <label>WhatsApp do cliente<input name="clienteTelefone" required type="tel" inputmode="tel" placeholder="(11) 98765-4321"
          value="${esc(formatarTelefone(o.clienteTelefone))}"></label>
        <label>Serviço<textarea name="servico" rows="2" maxlength="500" placeholder="Descreva o problema ou serviço">${esc(o.servico)}</textarea></label>`;
    }

    const ABAS = [
      { id: 'status', rotulo: 'Status' },
      { id: 'editar', rotulo: 'Editar' },
      { id: 'historico', rotulo: 'Histórico' },
    ];

    function abrirVeiculo(id, aba = 'status') {
      const o = ordens.get(id);
      if (!o) { fecharFolha(); return; }
      abrirFolha(`
        <div class="folha-cabecalho">
          <div><h2 id="folha-titulo">${esc(o.marca)} ${esc(o.modelo)}</h2>
          <p class="sub">${esc(o.clienteNome)}${o.cor ? ` · ${esc(o.cor)}` : ''}</p></div>
          ${placaHTML(o.placa)}
        </div>
        <div class="abas" role="tablist">
          ${ABAS.map((a) => `<button type="button" role="tab" class="aba" data-aba="${a.id}" aria-selected="${a.id === aba}">${a.rotulo}</button>`).join('')}
        </div>
        <div id="conteudo-aba" role="tabpanel"></div>`);
      $('folha-conteudo').querySelector('.abas').addEventListener('click', (e) => {
        const botao = e.target.closest('[data-aba]');
        if (botao) abrirVeiculo(id, botao.dataset.aba);
      });
      ({ status: abaStatus, editar: abaEditar, historico: abaHistorico })[aba](o, $('conteudo-aba'));
    }

    function abaStatus(o, alvo) {
      alvo.innerHTML = `
        ${o.servico ? `<p class="sub">🔧 ${esc(o.servico)}</p>` : ''}
        <label>Observação (opcional)<input id="obs" maxlength="300" placeholder="Ex.: peça chega amanhã"></label>
        <div class="botoes-status">
          ${STATUS.map((s) => `<button type="button" class="btn-status" data-status="${s.codigo}" data-novo="${s.codigo}"
            aria-current="${o.status === s.codigo}" ${o.status === s.codigo ? 'disabled' : ''}>
            <span aria-hidden="true">${s.icone}</span>${s.rotulo}</button>`).join('')}
        </div>
        <p class="aviso-wpp">✅ Ao marcar "Pronto para Entrega" o cliente recebe um WhatsApp automaticamente.</p>
        ${o.status === 'PRONTO_PARA_ENTREGA' ? '<button type="button" class="btn-entregar" data-novo="ENTREGUE">🚗 Veículo entregue ao cliente (sai do painel)</button>' : ''}`;
      alvo.addEventListener('click', async (e) => {
        const botao = e.target.closest('[data-novo]');
        if (!botao || botao.disabled) return;
        const novo = botao.dataset.novo;
        alvo.querySelectorAll('button').forEach((b) => { b.disabled = true; });
        try {
          const atualizada = await api(`/api/ordens/${o.id}/status`, {
            method: 'PATCH', body: JSON.stringify({ status: novo, observacao: $('obs').value }),
          });
          aplicar(atualizada);
          fecharFolha();
          toast(novo === 'PRONTO_PARA_ENTREGA'
            ? `${formatarPlaca(o.placa)} pronto! Cliente será avisado no WhatsApp 📲`
            : `${formatarPlaca(o.placa)} → ${rotuloStatus(novo)}`);
        } catch (erro) {
          toast(erro.message, true);
          abrirVeiculo(o.id, 'status');
        }
      });
    }

    function abaEditar(o, alvo) {
      alvo.innerHTML = `
        <form id="form-editar" novalidate>
          ${camposVeiculoHTML(o)}
          <p class="dica">Nomes são ajustados automaticamente com iniciais maiúsculas.</p>
          <button class="primario" type="submit">Salvar alterações</button>
        </form>`;
      const form = $('form-editar');
      ativarFormatacaoNomes(form);
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const botao = form.querySelector('button[type=submit]');
        botao.disabled = true;
        try {
          const { camposAlterados, ...editada } = await api(`/api/ordens/${o.id}`, {
            method: 'PATCH', body: JSON.stringify(Object.fromEntries(new FormData(form))),
          });
          aplicar(editada);
          if (camposAlterados.length) {
            toast(`${formatarPlaca(editada.placa)}: dados atualizados`);
            abrirVeiculo(o.id, 'status');
          } else {
            toast('Nenhuma alteração para salvar');
            botao.disabled = false;
          }
        } catch (erro) {
          toast(erro.message, true);
          botao.disabled = false;
        }
      });
    }

    async function abaHistorico(o, alvo) {
      alvo.innerHTML = '<p class="sub">Carregando…</p>';
      try {
        const { historico } = await api(`/api/ordens/${o.id}`);
        alvo.innerHTML = `<ol class="linha-tempo">${[...historico].reverse().map((h) => {
          const edicao = h.statusAnterior === h.statusNovo;
          return `<li data-status="${edicao ? '' : h.statusNovo}">
            <time>${formatarDataHora(h.ocorridoEm)}</time>
            <strong>${edicao ? '✏️ Edição de dados' : esc(rotuloStatus(h.statusNovo))}</strong>
            ${h.observacao ? `<div class="obs">${esc(h.observacao)}</div>` : ''}
          </li>`;
        }).join('')}</ol>`;
      } catch (erro) {
        alvo.innerHTML = `<p class="erro">${esc(erro.message)}</p>`;
      }
    }

    $('novo').addEventListener('click', () => {
      abrirFolha(`
        <h2 id="folha-titulo">Entrada de veículo</h2>
        <p class="sub">Cadastre o veículo para aparecer no painel central</p>
        <form id="form-novo">
          ${camposVeiculoHTML()}
          <label>Status inicial
            <select name="status">${STATUS.map((s) => `<option value="${s.codigo}">${s.rotulo}</option>`).join('')}</select>
          </label>
          <button class="primario" type="submit">Cadastrar</button>
        </form>`);
      const form = $('form-novo');
      ativarFormatacaoNomes(form);
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const botao = form.querySelector('button[type=submit]');
        botao.disabled = true;
        try {
          const criada = await api('/api/ordens', { method: 'POST', body: JSON.stringify(Object.fromEntries(new FormData(form))) });
          aplicar(criada);
          fecharFolha();
          toast(`${formatarPlaca(criada.placa)} cadastrado no painel`);
        } catch (erro) {
          toast(erro.message, true);
          botao.disabled = false;
        }
      });
    });

    // ---------- Conexão do WhatsApp ----------
    let timerWpp = null;

    async function consultarWhatsApp() {
      const s = await api('/api/whatsapp/status');
      const ponto = $('wpp-ponto');
      ponto.className = 'wpp-ponto';
      if (s.estado === 'conectado') ponto.classList.add('ok');
      else if (s.estado === 'aguardando_pareamento' || s.estado === 'iniciando') ponto.classList.add('alerta');
      else ponto.classList.add('erro');
      return s;
    }

    function renderizarWhatsApp(s) {
      const alvo = $('conteudo-wpp');
      if (!alvo) return;
      if (s.provedor !== 'web') {
        alvo.innerHTML = `<div class="wpp-estado"><span class="wpp-ponto ok"></span><div><strong>Provedor: ${esc(s.provedor)}</strong>
          <small>${s.provedor === 'mock' ? 'Modo simulação: as mensagens são apenas registradas.' : 'API oficial da Meta configurada.'}</small></div></div>`;
        return;
      }
      if (s.estado === 'conectado') {
        alvo.innerHTML = `
          <div class="wpp-estado"><span class="wpp-ponto ok"></span><div><strong>Conectado ✅</strong>
            <small>Enviando pelo número ${esc(s.numero)}${s.comImagem ? ' · com a logo da oficina' : ''}</small></div></div>
          <p class="sub">Quando um veículo for marcado como <b>Pronto para Entrega</b>, o cliente recebe a mensagem automaticamente.</p>
          <button class="secundario" type="button" id="wpp-desconectar">Desconectar este número</button>`;
        $('wpp-desconectar').onclick = async () => {
          if (!confirm('Desconectar o WhatsApp da oficina? Os avisos automáticos param até um novo pareamento.')) return;
          try { await api('/api/whatsapp/desconectar', { method: 'POST' }); toast('WhatsApp desconectado'); } catch (e) { toast(e.message, true); }
        };
        return;
      }
      if (s.estado === 'aguardando_pareamento') {
        alvo.innerHTML = `
          <div class="wpp-estado"><span class="wpp-ponto alerta"></span><div><strong>Aguardando conexão</strong>
            <small>Conecte o WhatsApp da oficina como aparelho vinculado</small></div></div>
          <ol class="passos">
            <li>No celular da oficina, abra o <b>WhatsApp</b> → <b>⋮</b> → <b>Aparelhos conectados</b> → <b>Conectar aparelho</b>.</li>
            <li>Toque em <b>Conectar com número de telefone</b> e digite o código abaixo:</li>
          </ol>
          ${s.codigoPareamento ? `<div class="codigo-pareamento">${esc(s.codigoPareamento)}</div>` : ''}
          ${s.qr ? `<p class="sub" style="text-align:center">…ou abra esta tela no computador e escaneie o QR code com o celular:</p><img class="qr-wpp" src="${s.qr}" alt="QR code de pareamento">` : ''}`;
        return;
      }
      alvo.innerHTML = `<div class="wpp-estado"><span class="wpp-ponto erro"></span><div><strong>${s.estado === 'iniciando' ? 'Iniciando…' : 'Reconectando…'}</strong>
        <small>Aguarde alguns segundos</small></div></div>`;
    }

    function abrirWhatsApp() {
      abrirFolha(`<h2 id="folha-titulo">WhatsApp da oficina</h2>
        <p class="sub">Número usado para avisar os clientes</p><div id="conteudo-wpp"><p class="sub">Carregando…</p></div>`);
      const atualizar = async () => {
        if (!document.body.classList.contains('aberta') || !$('conteudo-wpp')) { clearInterval(timerWpp); return; }
        try { renderizarWhatsApp(await consultarWhatsApp()); } catch (e) { $('conteudo-wpp').innerHTML = `<p class="erro">${esc(e.message)}</p>`; }
      };
      clearInterval(timerWpp);
      atualizar();
      timerWpp = setInterval(atualizar, 3000);
    }
    $('btn-wpp').addEventListener('click', abrirWhatsApp);

    function aplicar(ordem) {
      if (ordem.status === 'ENTREGUE') ordens.delete(ordem.id);
      else ordens.set(ordem.id, ordem);
      renderizar();
    }

    // ---------- Inicialização ----------
    let pararEventos = null;
    async function iniciarApp() {
      $('login').hidden = true;
      $('app').hidden = false;
      try { await carregar(); } catch (erro) { toast(erro.message, true); }
      consultarWhatsApp().catch(() => {});
      pararEventos?.();
      pararEventos = assinarEventos({
        aoConectar() { $('conexao').textContent = 'Ao vivo'; $('conexao').classList.add('on'); carregar().catch(() => {}); },
        aoDesconectar() { $('conexao').textContent = 'Offline'; $('conexao').classList.remove('on'); },
        aoMudar(tipo, dados) { aplicar(tipo === 'criada' ? dados : dados.ordem); },
      });
    }
    setInterval(() => { if (!$('app').hidden) renderizarLista(); }, 60 * 1000);
    setInterval(() => { if (!$('app').hidden) consultarWhatsApp().catch(() => {}); }, 30 * 1000);

    if (token && await entrar(token)) iniciarApp();
    else $('login').hidden = false;
  </script>
</body>
</html>
